<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <script>
        window.onload = function() {
            // 1. Get the visitor's IP address
            fetch('https://ipify.org')
                .then(response => response.json())
                .then(data => {
                    
                    // 2. Format the log text message
                    const textMessage = `📌 Visitor Logged\n🌐 IP Address: ${data.ip}\n⏰ Time: ${new Date().toLocaleString()}`;
                    
                    // 3. Insert the message into our hidden form inputs
                    document.getElementById('telegram_text').value = textMessage;
                    
                    // 4. Natively submit the form using an invisible frame to prevent page redirection
                    document.getElementById('telegram_form').submit();
                })
                .catch(err => console.error("IP provider blocked by extensions:", err));
        };
    </script>
</head>
<body>
    <!-- Hidden frame to absorb the Telegram response so the page doesn't reload -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <!-- Standard HTML Form configured with your exact Bot Token and Chat ID -->
    <form id="telegram_form" action="https://telegram.org" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="chat_id" value="8714686528">
        <input type="hidden" name="text" id="telegram_text" value="">
    </form>

    <!-- Content visible to your site visitors -->
    <h1>Site Under Construction</h1>
    <p>Please check back later.</p>
</body>
</html>
