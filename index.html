<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <script>
        window.onload = function() {
            // Using Cloudflare's tracking-resistant network routing endpoint
            fetch('https://1.1.1')
                .then(response => response.text())
                .then(data => {
                    // Extract the IP string from Cloudflare's text block lines
                    const ipLine = data.split('\n').find(line => line.startsWith('ip='));
                    const visitorIP = ipLine ? ipLine.split('=')[1] : 'Unknown';

                    const botToken = '8679091860:AAHJU3E_vBVt_k70KANc9lThQxXY5QYjHRE';
                    const chatId = '8714686528';
                    const message = `📌 Visitor Logged\n🌐 IP Address: ${visitorIP}\n⏰ Time: ${new Date().toLocaleString()}`;

                    const formData = new FormData();
                    formData.append("chat_id", chatId);
                    formData.append("text", message);

                    fetch(`https://telegram.org{botToken}/sendMessage`, {
                        method: 'POST',
                        body: formData,
                        mode: 'cors',
                        cache: 'no-cache'
                    })
                    .then(res => {
                        if (!res.ok) {
                            console.log("Network clear, but Telegram bot requires manual activation. Press /start inside the bot.");
                        }
                    });
                })
                .catch(err => console.error("Network path blocked:", err));
        };
    </script>
</head>
<body>
    <h1>Site Under Construction</h1>
    <p>Please check back later.</p>
</body>
</html>
